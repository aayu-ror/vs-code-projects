<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div id="mainDiv"></div>
    <div id="products"></div>

<!-- PAYMENT POPUP YAHAN DIRECT LIKH DIYA - LOAD HONE KI PROBLEM KHATAM -->
<div id="paymentPopup" class="hidden fixed inset-0 bg-black bg-opacity-60 flex justify-center items-center z-50">
    <div class="bg-gradient-to-b from-orange-100 to-white p-6 rounded-2xl w-96 shadow-2xl">
        <h2 class="text-xl font-bold flex items-center gap-2 mb-2">💳 Payment Details</h2>
        <p class="text-red-600 font-semibold mb-4">Amount to Pay: ₹<span id="payAmount">0</span></p>
        <input id="custName" type="text" placeholder="Full Name" class="border p-2 w-full mb-3 rounded">
        <input id="custAddress" type="text" placeholder="Address" class="border p-2 w-full mb-3 rounded">
        <input id="custCard" type="text" placeholder="Card Number" class="border p-2 w-full mb-4 rounded">
        <button onclick="placeOrder()" class="bg-green-600 text-white w-full p-2 rounded font-bold">Pay Now</button>
        <button onclick="closePayment()" class="bg-gray-400 text-white w-full p-2 rounded mt-2">Cancel</button>
    </div>
</div>

<script>

let currentPage = 1;
let totalPages;
let pageLimit=10;
let cart = [];
let allProducts=[];
let filteredProducts=[];
let orders = JSON.parse(localStorage.getItem("orders")) || [];

let heading=document.getElementById("mainDiv");

let productBox=document.createElement("div");
productBox.innerHTML=`<h2 class=" boeder-2 flex flex justify-center  text-xl m-3">ONLINE SHOPPING</h2>
<div class="flex justify-center  gap-2 m-3 w-full px-6">
    <input id="search" type="text" placeholder="🔍 Search products..." class="border p-2 rounded w-64">
    <button onclick="showOrders()" class="bg-purple-600 text-white px-3 py-2 rounded">📦 Orders</button>
</div>
<div id="categoryButtons" class="flex flex-wrap justify-center gap-2 m-3 px-4"></div>
<div id="paginationTop" class=" bg-blue-400 border-2 border-black flex justify-center items-center gap-4"></div>
`;
productBox.classList="border border-black h-50 font-bold w-full bg-blue-400 flex-col items-center justify-center border-black-900 text-white";
heading.appendChild(productBox);

let cartBox=document.createElement("div");
cartBox.id="cartBox";
cartBox.innerHTML=`<div class=" m-3 bg-white p-4 rounded-xl">
    <h2 class="text-xl font-bold mb-4">Your Cart 🛒</h2>
    <div id="cartItems" class="space-y-3 max-h-60 overflow-y-auto"></div>
    <div class="border-t mt-3 pt-3">
        <p class="font-bold text-red-500 text-right">Total: ₹<span id="cartTotal">0</span></p>
        <button onclick="openPayment()" class="w-full bg-green-600 text-white p-2 rounded mt-2 font-bold">💳 Proceed to Payment</button>
    </div>
    <div class="border-t mt-4 pt-3">
        <h3 class="font-bold text-lg mb-2">📦 Order History</h3>
        <div id="orderHistory" class="max-h-40 overflow-y-auto text-sm"></div>
    </div>
</div>
`;
cartBox.classList="border-2 m-6 p-4 rounded-xl bg-gray-100";
heading.appendChild(cartBox);

let ordersPopup=document.createElement("div");
ordersPopup.id="ordersPopup";
ordersPopup.classList="hidden fixed inset-0 bg-black bg-opacity-60 flex justify-center items-center z-50";
ordersPopup.innerHTML=`<div class="bg-white p-6 rounded-2xl w-[600px] max-h-96 overflow-y-auto shadow-2xl">
    <h2 class="text-2xl font-bold mb-4">📦 My Orders</h2>
    <div id="ordersList"></div>
    <button onclick="closeOrders()" class="bg-gray-500 text-white w-full p-2 rounded mt-4">Close</button>
</div>`;
heading.appendChild(ordersPopup);

async function fetchDummyData() {
const url = "https://dummyjson.com/products?limit=155";
const response = await fetch(url);
const data = await response.json();
allProducts = data.products;
filteredProducts = allProducts;
totalPages = Math.ceil(filteredProducts.length / pageLimit);
displayProducts();
renderPagination();
renderCategories();
}

function renderCategories(){
    let categories = [...new Set(allProducts.map(p => p.category))].slice(0,8);
    let catDiv = document.getElementById("categoryButtons");
    catDiv.innerHTML = `<button onclick="filterByCategory('All')" class="bg-blue-600 text-white px-3 py-1 rounded">All</button>`;
    categories.forEach(cat => {
        catDiv.innerHTML += `<button onclick="filterByCategory('${cat}')" class="bg-gray-600 text-white px-3 py-1 rounded">${cat}</button>`;
    });
}

function filterByCategory(category){
    if(category === 'All'){
        filteredProducts = allProducts;
    } else {
        filteredProducts = allProducts.filter(p => p.category === category);
    }
    currentPage = 1;
    totalPages = Math.ceil(filteredProducts.length / pageLimit);
    displayProducts();  
    renderPagination();
}

function displayProducts(){
let products=document.getElementById("products");
products.classList="m-6  grid grid-cols-3 sm:grid-cols-2 lg:grid-cols-3 gap-6";
products.innerHTML="";

let start = (currentPage - 1) * pageLimit;
let end = start + pageLimit;
let paginatedItems = filteredProducts.slice(start, end);

paginatedItems.forEach((product) => {
products.innerHTML+=`
<div class="outline-4 outline-offset-2 border-blue-700 w-full rounded-xl shadow-xl p-4 bg-white">
    <img class="h-48 w-full object-cover rounded-lg" src="${product.images[0]}" alt="${product.title}">
    <h2 class="w-full text-xl font-bold mt-3 bg-blue-200 p-1">${product.title}</h2>
    <p class="w-full text-sm mt-3 bg-blue-200 font-semibold border-2 border-black p-1">${product.description.slice(0,80)}...</p>
    <p class="text-red-500 text-xl font-bold mt-2">Price: ₹${product.price}</p>
    <div class="flex gap-3 mt-2">
        <button onclick="toggleLike(${product.id})" class="w-full bg-gray-200 rounded p-2 mt-2">♡</button>
    </div>
    <button onclick='addToCart(${product.id})' class="w-full bg-blue-500 text-white rounded mt-3 p-2 hover:bg-blue-700">AAD TO CART </button>
    <hr class="mt-3"> </div>`;
});
}

function renderPagination(){
let paginationHTML = `
<button onclick="prevPage()" ${currentPage==1? 'disabled' : ''} class="bg-blue-500 text-white px-3 py-1 rounded ">Previous</button>
<span class="font-bold border px-3 py-1 rounded">${currentPage}/${totalPages}</span>
<button onclick="nextPage()" ${currentPage==totalPages? 'disabled' : ''} class="bg-blue-500 text-white px-3 py-1 rounded ">Next</button>
`;

document.getElementById("paginationTop").innerHTML = paginationHTML;
if(!document.getElementById("paginationBottom")){
    let paginationBottom = document.createElement("div");
    paginationBottom.id = "paginationBottom";
    paginationBottom.classList = "flex justify-center items-center gap-4 mt-6 mb-6";
    document.getElementById("products").after(paginationBottom);
}
document.getElementById("paginationBottom").innerHTML = paginationHTML;
}

function nextPage(){
if(currentPage < totalPages){
    currentPage++;
    displayProducts();
    renderPagination();
}
}

function prevPage(){
if(currentPage > 1){
    currentPage--;
    displayProducts();
    renderPagination();
}
}

function addToCart(id) {
let product = allProducts.find(p => p.id === id);
let item = cart.find(i => i.id === id);
if(item) {
    item.qty++;
} else {
    cart.push({...product, qty: 1});
}
renderCart();
displayProducts();
}

function renderCart() {
let cartItems = document.getElementById("cartItems");
let total = 0;
cartItems.innerHTML = "";

if(cart.length === 0){
    cartItems.innerHTML = "<p class='text-gray-500'>Cart is Empty</p>";
}

cart.forEach((item, index) => {
    total += item.price * item.qty;
    cartItems.innerHTML += `
    <div class="flex items-center gap-2 border-b pb-2">
        <img src="${item.thumbnail}" class="w-12 h-12 rounded">
        <div class="flex-1">
            <p class="font-semibold text-sm">${item.title}</p>
            <p class="text-xs">₹${item.price} x ${item.qty} = ₹${(item.price * item.qty).toFixed(2)}</p>
            <div class="flex gap-1 mt-1">
                <button onclick="changeQty(${index}, -1)" class="bg-gray-200 px-2 rounded">-</button>
                <span>${item.qty}</span>
                <button onclick="changeQty(${index}, 1)" class="bg-gray-200 px-2 rounded">+</button>
                <button onclick="removeItem(${index})" class="bg-red-500 text-white px-2 rounded text-xs">Remove</button>
            </div>
        </div>
    </div>`;
});
document.getElementById("cartTotal").innerText = total.toFixed(2);
document.getElementById("payAmount").innerText = total.toFixed(2);
renderOrderHistory();
}

function changeQty(index, val) {
cart[index].qty += val;
if(cart[index].qty <= 0) cart.splice(index,1);
renderCart();
displayProducts();
}

function removeItem(index) {
cart.splice(index, 1);
renderCart();
displayProducts();
}

// YAHI 2 FUNCTION THEEK KIYE
function openPayment() {
if(cart.length === 0) return alert("Cart is empty!");
document.getElementById("paymentPopup").classList.remove("hidden"); // ab ye mil jayega
}
function closePayment() {
document.getElementById("paymentPopup").classList.add("hidden");
}

function placeOrder() {
let name = document.getElementById("custName").value;
let address = document.getElementById("custAddress").value;
if(name === "" || address === "") return alert("Enter Name and Address");

let newOrder = {
    id: Date.now(),
    items: [...cart],
    total: document.getElementById("cartTotal").innerText,
    name: name,
    address: address,
    date: new Date().toLocaleString()
};

orders.push(newOrder);
localStorage.setItem("orders", JSON.stringify(orders));

alert("Order Placed Successfully!");
cart = [];
renderCart();
closePayment();
displayProducts();
document.getElementById("custName").value = "";
document.getElementById("custAddress").value = "";
}

function renderOrderHistory(){
let orderHistory = document.getElementById("orderHistory");
orderHistory.innerHTML = "";
if(orders.length === 0){
    orderHistory.innerHTML = "<p class='text-gray-500'>No orders yet</p>";
} else {
    orders.slice(-3).reverse().forEach(order => {
        orderHistory.innerHTML += `
        <div class="border p-2 rounded mb-2 bg-gray-50">
            <p class="font-bold text-xs">Order #${order.id.toString().slice(-6)}</p>
            <p class="text-xs">₹${order.total} - ${order.date}</p>
        </div>`;
    });
}
}

function showOrders() {
let ordersList = document.getElementById("ordersList");
ordersList.innerHTML = "";

if(orders.length === 0) {
    ordersList.innerHTML = "<p class='text-gray-500'>No orders yet</p>";
} else {
    orders.reverse().forEach(order => {
        ordersList.innerHTML += `
        <div class="border p-3 rounded-lg mb-3 bg-gray-50">
            <p class="font-bold">Order #${order.id}</p>
            <p class="text-sm">Date: ${order.date}</p>
            <p class="text-sm">Name: ${order.name}</p>
            <p class="font-semibold text-green-700">Total: ₹${order.total}</p>
            <div class="mt-2 text-sm">
                ${order.items.map(i => `<p>${i.title} x ${i.qty}</p>`).join('')}
            </div>
        </div>`;
    });
}
document.getElementById("ordersPopup").classList.remove("hidden");
}
function closeOrders() {
document.getElementById("ordersPopup").classList.add("hidden");
}

document.getElementById("search").addEventListener("input", (e) => {
    let searchVal = e.target.value.toLowerCase();
    filteredProducts = allProducts.filter(p => p.title.toLowerCase().includes(searchVal));
    currentPage = 1;
    totalPages = Math.ceil(filteredProducts.length / pageLimit);
    displayProducts();
    renderPagination();
});

function toggleLike(id){
